const chrono = (a, b) =>

const mmss = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? h + ":" + String(m).padStart(2, "0") + ":" + x : m + ":" + x;
};

function videoHtml(v, sansLecteur) {
  if (!v || !v.id) return '<p class="empty">Vidéo introuvable.</p>';
  const lien = "https://www.youtube.com/watch?v=" + v.id + (v.debut ? "&t=" + v.debut + "s" : "");
  const a = '<a class="yt" href="' + lien + '" target="_blank" rel="noopener">Ouvrir la vidéo sur YouTube</a>';
  if (sansLecteur)
    return '<p class="note">Cette vidéo ne peut pas être lue sur le site : à regarder directement sur YouTube.</p>' + a;
  let q = "rel=0";
  if (v.debut) q += "&start=" + v.debut;
  if (v.fin) q += "&end=" + v.fin;
  return '<div class="video"><iframe src="https://www.youtube.com/embed/' + v.id + "?" + q +
    '" title="Vidéo de l\'action" loading="lazy" allowfullscreen></iframe></div>' + a;
}

/* Time codes de tous les buts et passes D présents dans la même vidéo */
function timecodes(e) {
  const it = [];
  buts.forEach(x => it.push({ t: "But", x }));
  passes.forEach(x => it.push({ t: "Passe D", x }));
  const l = it.filter(i => i.x.video && i.x.video.id === e.video.id && i.x.video.debut != null)
    .sort((a, b) => a.x.video.debut - b.x.video.debut);
  return '<p class="note">Time codes dans la vidéo :</p><ul class="tc">' + l.map(i =>
    "<li" + (i.x === e ? ' class="ici"' : "") + '><a href="https://www.youtube.com/watch?v=' + e.video.id +
    "&t=" + i.x.video.debut + 's" target="_blank" rel="noopener">' + mmss(i.x.video.debut) + "</a> " + i.t +
    (i.x.minute != null ? " (" + i.x.minute + "’)" : "") + "</li>").join("") + "</ul>";
}

function media(e) {
  if (e.competition === "Coupe d'Allemagne" && e.video && e.video.id)
    return videoHtml(e.video, true) + timecodes(e);
  return videoHtml(e.video);
}

function numero(e, items) {
  const memes = items.filter(x => x.adversaire === e.adversaire && x.date === e.date);
  return memes.length > 1 ? memes.indexOf(e) + 1 : 0;
}

function carte(e, passe, num) {
  const chips = [];
  if (e.pied) chips.push("Pied : " + e.pied);
  if (passe && e.buteur) chips.push("Buteur : " + e.buteur);
  if (!passe && e.passeur) chips.push("Passeur : " + e.passeur);
  if (e.xg != null) chips.push("xG " + fmt(e.xg));
  if (e.xgot != null) chips.push("xGOT " + fmt(e.xgot));
  return '<details class="card"><summary><span class="no">n°' + e.n + '</span><span class="vs">vs ' + e.adversaire + (num ? " #" + num : "") + '</span>' +
    (e.minute != null ? '<span class="min">' + e.minute + "’</span>" : "") +
    '<span class="date">' + jour(e.date) + (e.competition ? ", " + e.competition : "") + "</span></summary>" +
    '<div class="body"><div class="chips">' + chips.map(c => "<span>" + c + "</span>").join("") + "</div>" +
    media(e) + "</div></details>";
}

      (items.length ? blocs : '<p class="empty">Rien pour le moment.</p>') + "</details>";

}

const ORDRE = ["Matchs joués", "Minutes jouées", "Buts", "Passes décisives", "Grosses occasions créées", "Occasions créées",

const nombre = v => typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));

/* Catégorie Total : somme de toutes les compétitions qui ont des données */
function total(donnees) {
  const comps = Object.keys(donnees).filter(k => donnees[k].length);
  const base = n => n.replace(/ \(.*\)$/, "");
  const lire = (k, nom) => { const l = donnees[k].find(x => base(x[0]) === nom); return l ? nombre(l[1]) : null; };
  return ORDRE.map(nom => {
    const ok = comps.filter(k => lire(k, nom) !== null);
    if (!ok.length) return null;
    const somme = ok.reduce((a, k) => a + lire(k, nom), 0);
    const manque = comps.filter(k => !ok.includes(k));
    const part = nom === "xG" || nom === "xA";
    const v = part ? String(Math.round(somme * 100) / 100).replace(".", ",") : somme;
    const note = !manque.length ? "" : part ? "seulement : " + ok.join(", ") : "hors " + manque.join(", ");
    return [nom, v, note];
  }).filter(Boolean);
}

function decisifs() {

  ajoute(buts, "buts");
  ajoute(passes, "passes");
  return Object.entries(t).sort((a, b) =>
    (b[1].buts + b[1].passes) - (a[1].buts + a[1].passes) ||
    b[1].buts - a[1].buts ||
    a[0].localeCompare(b[0], "fr"));
}

  const rang = decisifs();
